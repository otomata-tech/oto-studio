<!doctype html>
<!-- Visuels de la section « cas d'usage » d'oto.cx. Un seul fichier, quatre rendus choisis par ?v= :
     og-index, og-<secteur> (1200×630), hero-index, hero-btp (héros de colonne, fond transparent).
     &t=encre : variante des héros pour une section sur fond encre (trait crème, mêmes accents).
     Charte du SITE (crème, minuscules, hairlines, squiggle), pas la riso des posts.
     Règles : aucun logo ni nom de client, aucun chiffre de gain. Rendu : build.sh. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts.css">
<style>
  :root {
    --bg: #fefcf5; --paper-2: #f4ecd2; --surface: #ffffff;
    --ink: #2c2112; --ink-soft: #4a3a23; --mute: #6c5e44; --faint: #a89a78; --hair: #dccfa8;
    --saffron: #f0b41e; --saffron-soft: #fbe7a8; --saffron-ink: #5a3b03;
    --terra: #d63d0a; --terra-soft: #f7cdbb; --terra-ink: #5a1804;
    --olive: #8aa620; --olive-soft: #e6eec0; --olive-ink: #3e4c0c;
    --cobalt: #1f6dba; --cobalt-soft: #c4dcf0; --cobalt-ink: #0b2e54;
    --display: "Bricolage Grotesque", sans-serif; --sans: "Hanken Grotesk", sans-serif; --mono: "JetBrains Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; color: var(--ink); font-family: var(--sans); }
  .v { display: none; position: relative; overflow: hidden; }
  body[data-v="og-index"] #og-index, body[data-v="og-secteur"] #og-secteur,
  body[data-v="hero-index"] #hero-index, body[data-v="hero-btp"] #hero-btp { display: block; }

  /* ---- OG 1200×630, repris de og-oto.jpg ---- */
  .og { width: 1200px; height: 630px; background: var(--bg); padding: 72px 72px 0; }
  .wordmark { font-family: var(--display); font-weight: 700; font-size: 30px; font-variation-settings: "wdth" 90; letter-spacing: -0.01em; }
  .wordmark b { color: var(--terra); }
  .kicker { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--terra); }
  .og h1 { font-family: var(--display); font-weight: 700; font-variation-settings: "wdth" 90; letter-spacing: -0.025em; line-height: 1.02; }
  .sq { position: relative; color: var(--terra); white-space: nowrap; }
  .sq svg { position: absolute; left: -2%; width: 104%; bottom: -0.16em; height: 0.26em; overflow: visible; }
  .pills { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; }
  .pill { font-family: var(--mono); font-size: 17px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--hair); background: var(--paper-2); color: var(--ink-soft); display: inline-flex; align-items: center; gap: 10px; }
  .pill i { width: 10px; height: 10px; display: inline-block; }
  .pill .pic svg { width: 22px; height: 22px; display: block; color: var(--ink); }
  .url { position: absolute; right: 72px; bottom: 76px; font-family: var(--mono); font-size: 18px; color: var(--mute); }

  #og-index h1 { font-size: 84px; margin-top: 64px; max-width: 1000px; }
  #og-index .sub { font-size: 27px; color: var(--ink-soft); margin-top: 40px; }
  #og-secteur .kicker { margin-top: 44px; }
  #og-secteur h1 { font-size: 76px; margin-top: 20px; width: 600px; }
  #og-secteur .sub { font-size: 25px; line-height: 1.4; color: var(--ink-soft); margin-top: 30px; width: 560px; }
  #og-secteur .dessin { position: absolute; right: 30px; top: 150px; width: 480px; }

  /* ---- héros : fond transparent, posés sur la section ---- */
  #hero-index { width: 560px; height: 520px; }
  #hero-btp { width: 560px; height: 580px; }

  .card { position: absolute; width: 272px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 20px 22px 22px; }
  .card .top { display: flex; align-items: center; justify-content: space-between; }
  .card .sect { margin-top: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }
  .badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .badge i { width: 7px; height: 7px; display: inline-block; }
  .card h3 { font-family: var(--display); font-variation-settings: "wdth" 90; font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: -0.015em; margin-top: 16px; }
  .card .lines { margin-top: 16px; display: grid; gap: 8px; }
  .card .lines span { display: block; height: 7px; border-radius: 4px; background: var(--paper-2); }
  .under { position: absolute; border-radius: 14px; background: var(--saffron); }

  .devis { position: absolute; left: 150px; top: 330px; width: 390px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 18px 22px 16px; }
  .devis .head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); padding-bottom: 12px; border-bottom: 1px solid var(--hair); }
  .row { display: grid; grid-template-columns: 1fr 70px 76px; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--paper-2); font-size: 16px; color: var(--ink); }
  .row:last-child { border-bottom: 0; }
  .row .q { height: 7px; border-radius: 4px; background: var(--paper-2); }
  .tag { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-align: right; }
  .tag.m { color: var(--ink); } .tag.d { color: #b07d04; }
</style>
</head>
<body>

<!-- ======== OG index ======== -->
<div class="v og" id="og-index"></div>

<!-- ======== OG secteur (og-btp, og-saas, og-edition, og-conseil) : rempli depuis OG_SECTEURS ======== -->
<div class="v og" id="og-secteur"></div>

<!-- ======== héros index : quatre fiches, les quatre maturités ======== -->
<div class="v" id="hero-index"></div>

<!-- ======== héros BTP : relevé → devis ======== -->
<div class="v" id="hero-btp">
  <div data-roof="hero" style="position:absolute; left:0; top:0; width:560px;"></div>
  <svg style="position:absolute; left:0; top:0" width="560" height="580" viewBox="0 0 560 580">
    <path d="M60 276 C 60 346, 80 366, 136 366" fill="none" stroke="#f0b41e" stroke-width="3" stroke-linecap="round"/>
    <path d="M126 356 L 138 366 L 126 376" fill="none" stroke="#f0b41e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="devis" style="top:316px" id="devis-btp"></div>
</div>

<script src="commun.js"></script>
<script src="i18n.js"></script>
<script src="scenes.js"></script>
<script>
const MATURITES = [
  { key: 'en_prod', label: 'en production', accent: 'olive' },
  { key: 'pilote', label: 'pilote', accent: 'saffron' },
  { key: 'faisable', label: 'faisable', accent: 'cobalt' },
  { key: 'a_construire', label: 'à construire', accent: 'terra' },
];
const byKey = Object.fromEntries(MATURITES.map(m => [m.key, m]));
const badge = k => { const m = byKey[k]; return `<span class="badge" style="background:var(--${m.accent}-soft);color:var(--${m.accent}-ink)"><i style="background:var(--${m.accent})"></i>${m.label}</span>`; };

// Les pictos de secteur sont lus tels quels (currentColor) : le rendu passe --allow-file-access-from-files.
const picto = s => { const x = new XMLHttpRequest(); x.open('GET', `pictos/${s}.svg`, false); x.send(); return x.responseText; };


// Quatre vraies fiches du site, une par maturité (titres raccourcis) — éventail.
const FICHES = [
  { sect: 'édition',       titre: "enrichir une base de prospection",          mat: 'en_prod', x: 6,   y: 22,  r: -3 },
  { sect: 'btp',           titre: "fiche de visite depuis l'enregistrement",  mat: 'pilote',  x: 272, y: 64,  r: 2.5 },
  { sect: 'conseil',       titre: "préparation d'un rendez-vous client",       mat: 'faisable', x: 18,  y: 250, r: 2 },
  { sect: 'btp',           titre: "planning de chantiers et d'équipes",       mat: 'a_construire', x: 280, y: 292, r: -2.5 },
];
document.getElementById('hero-index').innerHTML = FICHES.map((f, i) => `
  ${i === 1 ? `<div class="under" style="left:${f.x + 9}px;top:${f.y + 9}px;width:272px;height:188px;transform:rotate(${f.r}deg)"></div>` : ''}
  <div class="card" style="left:${f.x}px;top:${f.y}px;transform:rotate(${f.r}deg);height:188px">
    ${badge(f.mat)}
    <h3>${f.titre}</h3>
    <div class="lines"><span style="width:92%"></span></div>
    <div class="sect">${f.sect}</div>
  </div>`).join('');

// Le toit vient de commun.js ; les OG le portent avec des étiquettes plus grandes.
const roof = mode => `<svg viewBox="-92 50 712 325" width="100%" style="display:block; overflow:visible">${toit({ fs: mode === 'og' ? 15 : 13 })}</svg>`;

// Images de partage : des phrases entières par langue (le mot souligné compris), pas des mots traduits un à un.
const SQ = mot => `<span class="sq">${mot}<svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M2 12 Q 27 2 52 11 T 102 11 T 152 11 T 198 9" fill="none" stroke="#f0b41e" stroke-width="5" stroke-linecap="round"/></svg></span>`;
const haut = s => `<svg viewBox="0 0 560 280" width="100%" style="display:block; overflow:visible">${HAUTS[s]()}</svg>`;
const TEXTES = {
  fr: {
    url: 'oto.cx/cas-usage', kicker: "cas d'usage",
    court: { btp: 'btp', saas: 'saas', edition: 'édition et culture', conseil: 'conseil' },
    index: { h1: `ce qu'un agent fait ${SQ('vraiment')} dans votre entreprise.`, sub: "par secteur, de la première demande jusqu'au paiement." },
    btp: { h1: `le chiffrage devient une ${SQ('relecture')}.`, sub: "quelques cotes relevées sur le toit, l'agent déduit le reste et prépare le devis." },
    saas: { h1: `chaque compte a sa ligne de ${SQ('suivi')}.`, sub: "des comptes à trouver aux prélèvements échoués&nbsp;: l'agent tient le suivi, vous décidez." },
    edition: { h1: `une parution, et tous ceux qui doivent le ${SQ('savoir')}.`, sub: "l'agent trouve les structures actives, fait connaître vos dates et suit ce qui doit rentrer.", fs: 64 },
    conseil: { h1: `chaque réunion finit en ${SQ('actions')}.`, sub: "l'agent repère les missions, prépare vos rendez-vous et tient le dossier client." },
  },
  en: {
    url: 'oto.cx/en/use-cases', kicker: 'use cases',
    court: { btp: 'construction', saas: 'saas', edition: 'publishing & culture', conseil: 'consulting' },
    index: { h1: `what an agent ${SQ('actually')} does in your business.`, sub: 'by sector, from the first request to getting paid.' },
    btp: { h1: `quoting becomes a ${SQ('review')}.`, sub: 'a few measurements taken on the roof; the agent derives the rest and prepares the quote.' },
    saas: { h1: `every account gets its own ${SQ('follow-up')}.`, sub: 'from finding accounts to failed direct debits: the agent keeps track, you decide.' },
    edition: { h1: `a release, and everyone who needs to ${SQ('know')}.`, sub: 'the agent finds active organizations, spreads the word on your dates and tracks the money due.', fs: 64 },
    conseil: { h1: `every meeting ends in ${SQ('actions')}.`, sub: 'the agent spots engagements, prepares your meetings and keeps the client file up to date.' },
  },
}[LANGUE];
if (!TEXTES) throw new Error(`langue sans textes : ${LANGUE}`);
const DESSINS = { btp: () => roof('og'), saas: () => haut('saas'), edition: () => haut('edition'), conseil: () => haut('conseil') };

document.getElementById('og-index').innerHTML = `
  <div class="wordmark">oto<b>.</b>cx</div>
  <h1>${TEXTES.index.h1}</h1>
  <p class="sub">${TEXTES.index.sub}</p>
  <div class="pills">${Object.entries(TEXTES.court).map(([s, l]) => `<span class="pill"><span class="pic">${picto(s)}</span>${l}</span>`).join('')}</div>
  <div class="url">${TEXTES.url}</div>`;

// Le devis du héros BTP, libellés traduits par T().
document.getElementById('devis-btp').innerHTML = `
  <div class="head"><span>${T('devis · à importer')}</span><span>${T('statut')}</span></div>
  ${[['couverture tuile', 'déduit'], ['faîtage', 'mesuré'], ['rives', 'déduit'], ['égout', 'déduit'], ['échafaudage', 'déduit']]
    .map(([l, st]) => `<div class="row"><span>${T(l)}</span><span class="q"></span><span class="tag ${st === 'mesuré' ? 'm' : 'd'}">${T(st)}</span></div>`).join('')}`;

let v = Q.get('v') || 'og-index';
const sect = v.startsWith('og-') && TEXTES[v.slice(3)] && v !== 'og-index' ? v.slice(3) : null;
if (sect) {
  const o = TEXTES[sect];
  document.getElementById('og-secteur').innerHTML = `
    <div class="wordmark">oto<b>.</b>cx</div>
    <p class="kicker">${TEXTES.kicker} · ${TEXTES.court[sect]}</p>
    <h1 style="${o.fs ? `font-size:${o.fs}px` : ''}">${o.h1}</h1>
    <p class="sub">${o.sub}</p>
    <div class="dessin">${DESSINS[sect]()}</div>
    <div class="url">${TEXTES.url}/${sect}</div>`;
  v = 'og-secteur';
}
document.querySelectorAll('[data-roof]').forEach(el => el.innerHTML = roof(el.dataset.roof));
document.body.dataset.v = v;
</script>
</body>
</html>
