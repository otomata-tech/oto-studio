<!doctype html>
<!-- Rend une scène de scenes.js, choisie par ?v= : <secteur>-NN (moments du récit, 560×320), hero-<secteur>
     (héros de secteur, 560×580, à rendre avec &t=encre) et hero-explorateur (520×420). Fond transparent.
     Aucun nom de client, aucun chiffre de gain. Rendu : build.sh. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts.css">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<script src="commun.js"></script>
<script src="scenes.js"></script>
<script>
const [w, h, dessin] = SCENES[Q.get('v') || 'btp-01'];
document.body.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${dessin()}</svg>`;
</script>
</body>
</html>
