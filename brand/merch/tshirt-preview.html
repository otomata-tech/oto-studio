<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @page {
            size: A4 landscape;
            margin: 20mm;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            height: 100vh;
            background: #E8E4D9;
            font-family: 'Inter', sans-serif;
        }

        .tshirt {
            position: relative;
            width: 300px;
            height: 400px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }

        .tshirt.v1, .tshirt.v2 {
            background: #F4D03F;
        }

        .tshirt-label {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(44, 62, 80, 0.2);
        }

        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #FDF6E3;
        }

        .wordmark {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .tshirt.v1 .wordmark { color: #FDF6E3; }
        .tshirt.v2 .wordmark { color: #2C3E50; }
    </style>
</head>
<body>
    <div class="tshirt v1">
        <div class="tshirt-label">Texte cream</div>
        <div class="circle"></div>
        <div class="wordmark">otomata</div>
    </div>
    <div class="tshirt v2">
        <div class="tshirt-label">Texte navy</div>
        <div class="circle"></div>
        <div class="wordmark">otomata</div>
    </div>
</body>
</html>
