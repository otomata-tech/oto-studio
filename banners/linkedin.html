<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #fefcf5;
    --surface: #ffffff;
    --ink: #2c2112;
    --mute: #6c5e44;
    --hair: #dccfa8;
    --primary: #f0b41e;
    --primary-soft: #fbe7a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    background-image:
      linear-gradient(to right, rgba(44, 33, 18, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44, 33, 18, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--ink);
    font-family: "Hanken Grotesk", sans-serif;
  }
  .grain {
    position: absolute; inset: 0; z-index: 40; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity: 0.07;
    mix-blend-mode: multiply;
  }
  .sun {
    position: absolute; z-index: 0;
    right: -180px; top: -260px;
    width: 760px; height: 760px;
    background: radial-gradient(closest-side, rgba(240,180,30,0.42), rgba(240,180,30,0.12) 55%, transparent 72%);
  }

  .mono { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.18em; }
  .display {
    font-family: "Bricolage Grotesque", sans-serif;
    font-optical-sizing: auto;
    font-variation-settings: "wdth" 90;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  /* la photo de profil recouvre le bas-gauche : rien d'important avant x=300 */
  .copy { position: absolute; left: 300px; top: 96px; z-index: 2; }
  .copy .kicker { font-size: 15px; color: var(--mute); margin-bottom: 20px; }
  .copy .kicker b { color: var(--ink); font-weight: 700; }
  .copy .line { font-size: 60px; line-height: 1.04; text-shadow: 5px 5px 0 var(--primary); }
  .copy .sub {
    margin-top: 24px;
    font-family: "JetBrains Mono", monospace;
    font-size: 17px; letter-spacing: 0.08em; color: var(--mute);
  }
  .copy .sub b { color: var(--ink); font-weight: 700; }

  /* rappel du visuel du jour : trois sessions reliées */
  .motif { position: absolute; left: 1010px; top: 62px; width: 500px; height: 272px; z-index: 2; }
  .motif svg { position: absolute; inset: 0; overflow: visible; }
  .win {
    position: absolute;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: 5px 5px 0 rgba(44,33,18,0.85);
    overflow: hidden;
  }
  .win .bar { height: 18px; background: var(--ink); }
  .win.lead .bar { background: var(--primary); }
  .win .rows { padding: 10px 11px; display: flex; flex-direction: column; gap: 7px; }
  .win .r { height: 5px; background: rgba(108,94,68,0.42); }
  .win .r.hi { background: var(--primary); }
</style>
</head>
<body>

  <div class="sun"></div>

  <div class="copy">
    <div class="kicker mono"><b>Alexis Laporte</b> &nbsp;·&nbsp; Otomata</div>
    <div class="line display">Je mets des agents<br>au travail.</div>
    <div class="sub">otomata.tech &nbsp;·&nbsp; <b>oto.cx</b></div>
  </div>

  <div class="motif">
    <svg viewBox="0 0 500 272">
      <g transform="translate(3,4)">
        <path d="M 178 136 L 292 62" stroke="#f0b41e" stroke-width="3" fill="none"/>
        <path d="M 178 136 L 292 210" stroke="#f0b41e" stroke-width="3" fill="none"/>
      </g>
      <path d="M 178 136 L 292 62" stroke="#2c2112" stroke-width="3" fill="none"/>
      <path d="M 178 136 L 292 210" stroke="#2c2112" stroke-width="3" fill="none"/>
      <circle cx="178" cy="136" r="7" fill="#f0b41e" stroke="#2c2112" stroke-width="3"/>
    </svg>

    <div class="win lead" style="left:14px; top:82px; width:166px;">
      <div class="bar"></div>
      <div class="rows">
        <div class="r" style="width:78%"></div>
        <div class="r" style="width:58%"></div>
        <div class="r hi" style="width:68%"></div>
        <div class="r" style="width:44%"></div>
      </div>
    </div>

    <div class="win" style="left:290px; top:16px; width:150px;">
      <div class="bar"></div>
      <div class="rows">
        <div class="r" style="width:72%"></div>
        <div class="r hi" style="width:62%"></div>
        <div class="r" style="width:48%"></div>
      </div>
    </div>

    <div class="win" style="left:290px; top:166px; width:150px;">
      <div class="bar"></div>
      <div class="rows">
        <div class="r" style="width:66%"></div>
        <div class="r hi" style="width:74%"></div>
        <div class="r" style="width:42%"></div>
      </div>
    </div>
  </div>

  <div class="grain"></div>
</body>
</html>
