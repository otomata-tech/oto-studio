<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #fefcf5;
    --surface: #ffffff;
    --ink: #2c2112;
    --mute: #6c5e44;
    --hair: #dccfa8;
    --primary: #f0b41e;
    --primary-soft: #fbe7a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1500px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    background-image:
      linear-gradient(to right, rgba(44, 33, 18, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44, 33, 18, 0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    color: var(--ink);
    font-family: "Hanken Grotesk", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 80px 88px 84px;
  }
  .grain {
    position: absolute; inset: 0; z-index: 40; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity: 0.07;
    mix-blend-mode: multiply;
  }
  .sun {
    position: absolute; z-index: 0;
    right: -140px; top: -160px;
    width: 900px; height: 900px;
    background: radial-gradient(closest-side, rgba(240,180,30,0.38), rgba(240,180,30,0.10) 55%, transparent 72%);
  }
  .fade { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: var(--bg); opacity: 0; }

  .mono { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.16em; }
  .display {
    font-family: "Bricolage Grotesque", sans-serif;
    font-optical-sizing: auto;
    font-variation-settings: "wdth" 90;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; color: var(--mute); z-index: 1; margin-bottom: 40px;
  }
  header .brand { color: var(--ink); font-weight: 700; font-size: 16px; }

  /* ---- héros : le compteur ---- */
  .hero { z-index: 1; padding: 30px 0 46px; }
  .hero .num {
    font-size: 262px;
    line-height: 0.95;
    /* tabular-nums : sans ça les chiffres changent de largeur en défilant et le nombre
       tressaute. transform-origin au centre : le rebond doit gonfler, pas dériver. */
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .hero .sub {
    font-size: 27px;
    color: var(--mute);
    margin-top: 18px;
  }
  .hero .sub b { color: var(--ink); }

  /* ---- les connecteurs ajoutés : des logos, pas des mots ---- */
  .conns { margin-top: 40px; z-index: 1; }
  .conns-label { font-size: 15px; color: var(--mute); margin-bottom: 16px; letter-spacing: 0.16em; }
  .conns-row { display: flex; flex-wrap: wrap; gap: 18px; max-width: 730px; }
  .conns-row .c {
    width: 169px; height: 169px; flex: none;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: 7px 7px 0 rgba(44,33,18,0.85);
    display: flex; align-items: center; justify-content: center;
    transform-origin: 50% 50%;
  }
  .conns-row .c img { max-width: 96px; max-height: 96px; display: block; }
  .conns-row .c svg { width: 92px; height: 92px; display: block; }

  /* ---- les tampons ---- */
  .stamps {
    z-index: 1;
    border-top: 1.5px solid var(--ink);
    padding-top: 40px;
    display: flex; flex-wrap: wrap; gap: 18px 16px;
    align-content: flex-start;
  }
  .stamps span {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.02em;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(44,33,18,0.85);
    padding: 16px 22px;
    white-space: nowrap;
  }
  .stamps span.new { background: var(--primary); font-weight: 700; }

  /* ---- chute ---- */
  .phrase {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    padding-bottom: 36px; z-index: 1;
  }
  .phrase p { font-size: 84px; line-height: 1.07; }

  footer {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1.5px solid var(--ink);
    padding-top: 24px; font-size: 14px; color: var(--mute); z-index: 1;
  }
  footer .url { color: var(--ink); font-weight: 700; font-size: 16px; }
</style>
</head>
<body>

  <div class="sun" id="sun"></div>

  <header>
    <div class="brand mono">oto.cx</div>
    <div class="mono">La semaine d’oto · 28 août – 03 sept 2026</div>
  </header>

  <div class="hero" id="hero">
    <div class="num display" id="num">0</div>
    <div class="sub">appels d’outils servis à vos agents <b>cette semaine</b></div>
  </div>

  <div class="stamps">
    <span class="new" id="s0">12 672 → 85 163</span>
    <span id="s1">28 agents actifs</span>
    <span id="s2">un seul branchement MCP</span>
  </div>

  <div class="conns">
    <div class="conns-label mono">Connecteurs ajoutés depuis</div>
    <div class="conns-row" id="conns"></div>
  </div>

  <div class="phrase">
    <p class="display" id="ph">Et toujours<br>un seul branchement.</p>
  </div>

  <footer>
    <div class="mono">Open source · Otomata × Tiple</div>
    <div class="url mono">oto.cx</div>
  </footer>

  <div class="fade" id="fade"></div>
  <div class="grain"></div>

<script>
  const $ = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const io = (t0, d, t) => clamp((t - t0) / d);
  const eoc = p => 1 - Math.pow(1 - p, 3);
  const eob = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

  const TOTAL = 85163;
  const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
  const N = 3;
  const stamps = Array.from({ length: N }, (_, i) => $('s' + i));
  const rot = [-1.5, 1.2, -0.8];

  /* Les connecteurs ajoutés depuis le post « 12 672 » : quatre annoncés dans ce
     post-là (Sellsy, Lusha, Firecrawl, Apify), quatre dans le suivant (Salesforce,
     LightOn, Reddit, Zoho). Les fichiers sont LOCAUX : le rendu ne doit pas dépendre
     d'un CDN, et un token d'API n'a rien à faire dans un dépôt public. */
  const CONNS = [
    ['Sellsy', '../assets/logos/logo_sellsy.png'],
    ['Lusha', '../assets/logos/logo_lusha.png'],
    ['Firecrawl', '../assets/logos/logo_firecrawl.png'],
    ['Apify', '../assets/logos/logo_apify.png'],
    ['Salesforce', '../assets/logos/logo_salesforce.svg'],
    ['LightOn', '../assets/logos/logo_lighton.svg'],
    ['Reddit', '../assets/logos/logo_reddit.svg'],
    ['Zoho', '../assets/logos/logo_zoho.svg'],
  ];
  const conns = CONNS.map(([nom, src]) => {
    const el = document.createElement('span');
    el.className = 'c';
    el.innerHTML = `<img src="${src}" alt="${nom}">`;
    $('conns').appendChild(el);
    return el;
  });
  const rotC = [-2, 1.6, -1.2, 2.1, -1.7, 1.3, -2.2, 1.5];

  const T = {
    hero: 250,
    count: 550, countDur: 1750,
    shadow: 2450,
    stamp: i => 2900 + i * 330, stampDur: 380,
    conn: i => 4100 + i * 190, connDur: 420,
    phrase: 6100,
    fadeOut: 9000
  };
  const LOOP = 9550;
  window.__DURATION = LOOP;

  function render(t) {
    t = t % LOOP;
    $('sun').style.transform = `scale(${1 + 0.025 * Math.sin(t / 1300)})`;

    const phz = eoc(io(T.hero, 500, t));
    const hero = $('hero');
    hero.style.opacity = phz;
    hero.style.transform = `translateY(${24 * (1 - phz)}px)`;

    /* Le compteur ne défile pas, il EMBALLE : lent au départ, très rapide au milieu,
       arrêt net — et il avance par crans qui s'affinent (milliers, centaines, dizaines,
       unité), comme une machine qui compte, pas comme une interpolation lissée.
       À l'arrivée, un rebond amorti : c'est lui qui fait le « pop ». */
    const praw = io(T.count, T.countDur, t);
    const pc = praw < 0.5 ? 8 * praw ** 4 : 1 - Math.pow(-2 * praw + 2, 4) / 2;
    const cran = praw < 0.55 ? 1000 : praw < 0.8 ? 100 : praw < 0.95 ? 10 : 1;
    $('num').textContent = fmt(Math.min(TOTAL, Math.round(TOTAL * pc / cran) * cran));

    // la secousse ne vit que pendant la montée, et s'éteint avec elle
    const secousse = praw > 0.2 && praw < 1 ? (1 - praw) * 2.6 * Math.sin(t / 24) : 0;
    // rebond : une oscillation qui s'amortit, déclenchée juste avant l'arrêt
    const pop = io(T.count + T.countDur - 70, 700, t);
    const rebond = pop > 0 && pop < 1 ? 1 + 0.17 * Math.pow(1 - pop, 2.2) * Math.cos(pop * 21) : 1;
    const zoom = (0.88 + 0.12 * eoc(praw)) * rebond;
    $('num').style.transform = `translateX(${secousse}px) scale(${zoom})`;

    const psh = eoc(io(T.shadow, 400, t));
    $('num').style.textShadow = `${7 * psh}px ${7 * psh}px 0 #f0b41e`;

    stamps.forEach((el, i) => {
      const p = io(T.stamp(i), T.stampDur, t);
      const e = eob(p);
      el.style.opacity = clamp(p * 3);
      el.style.transform = `rotate(${rot[i] * (2 - e)}deg) scale(${1.45 - 0.45 * e})`;
    });

    // les connecteurs tombent l'un après l'autre, avec le même rebond que les tampons
    conns.forEach((el, i) => {
      const p = io(T.conn(i), T.connDur, t);
      const e = eob(p);
      el.style.opacity = clamp(p * 3);
      el.style.transform = `rotate(${rotC[i] * (2 - e)}deg) scale(${1.4 - 0.4 * e})`;
    });

    const pp = eoc(io(T.phrase, 600, t));
    const ps2 = eoc(io(T.phrase + 350, 400, t));
    const ph = $('ph');
    ph.style.opacity = pp;
    ph.style.transform = `translateY(${40 * (1 - pp)}px)`;
    ph.style.textShadow = `${5 * ps2}px ${5 * ps2}px 0 #f0b41e`;

    $('fade').style.opacity = io(T.fadeOut, 450, t);
  }

  window.__seek = render;
  render(0);

  const params = new URLSearchParams(location.search);
  if (params.get('capture') !== '1') {
    let s = null;
    function fr(now) { if (s === null) s = now; render(now - s); requestAnimationFrame(fr); }
    requestAnimationFrame(fr);
  }
</script>
</body>
</html>
