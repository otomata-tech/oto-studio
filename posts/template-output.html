<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>/* __FONTS__ */</style>
<style>
  /* Gabarit « faux output » — une capture d'agent, à la charte.
     Ce qu'il sert : montrer ce qu'un agent RÉPOND, sans commentaire ni chute. Le texte
     est la pièce à conviction ; la légende, c'est le post qui la porte, pas l'image.

     L'ombre dure sans flou ni radius est ce qui distingue notre capture d'une vraie
     capture d'écran : on ne fait pas croire, on cite. */
  :root { --bg:#fefcf5; --surface:#fff; --paper2:#f4ecd2; --ink:#2c2112; --ink-soft:#4a3a23;
          --mute:#6c5e44; --primary:#f0b41e; --brun:#5a3b03; --vermillon:#e84b16;
          --chartreuse:#a8c926; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:1500px; overflow:hidden; }
  body {
    position:relative; background:var(--bg);
    background-image:
      linear-gradient(to right, rgba(44,33,18,.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44,33,18,.03) 1px, transparent 1px);
    background-size:64px 64px;
    color:var(--ink); font-family:"JetBrains Mono",monospace;
    display:flex; align-items:center; justify-content:center; padding:52px 46px 62px;
  }
  .grain { position:absolute; inset:0; z-index:40; pointer-events:none; opacity:.07; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.55'/></svg>"); }
  .sun { position:absolute; z-index:0; right:-160px; top:-180px; width:820px; height:820px;
    background:radial-gradient(closest-side, rgba(240,180,30,.34), rgba(240,180,30,.09) 55%, transparent 72%); }

  .win { position:relative; z-index:1; width:1092px; height:1372px; background:var(--surface);
    border:3px solid var(--ink); box-shadow:16px 16px 0 rgba(44,33,18,.88);
    display:flex; flex-direction:column; overflow:hidden; }

  .bar { height:52px; flex:none; background:var(--paper2); border-bottom:3px solid var(--ink);
    display:flex; align-items:center; padding:0 20px; gap:11px; }
  .dot { width:15px; height:15px; border-radius:50%; border:2px solid var(--ink); }
  .bar .t { margin-left:auto; font-size:15px; color:var(--mute); letter-spacing:.02em; }

  .body { padding:32px 38px 34px; color:var(--ink-soft); }
  .u { color:var(--brun); font-weight:700; line-height:1.35; }
  .u::before { content:"❯ "; color:var(--primary); font-weight:700; }
  .meta { color:var(--mute); margin-top:10px; }
  .rep { margin-top:22px; }
  .rep > p:first-child::before { content:"● "; color:var(--vermillon); }
  .rep p { margin:0 0 14px 0; }
  b { color:var(--ink); font-weight:700; }
  i { color:var(--mute); font-style:italic; }
</style>
</head>
<body>
<div class="sun"></div>
<div class="win">
  <div class="bar">
    <span class="dot" style="background:var(--vermillon)"></span>
    <span class="dot" style="background:var(--primary)"></span>
    <span class="dot" style="background:var(--chartreuse)"></span>
    <span class="t" id="fenetre"></span>
  </div>
  <div class="body" id="corps">
    <div class="u" id="demande"></div>
    <div class="meta" id="meta"></div>
    <div class="rep" id="rep"></div>
  </div>
</div>
<div class="grain"></div>
<!--__DATA__-->
<script>
  const D = window.__OUT;
  const $ = id => document.getElementById(id);
  $('fenetre').textContent = D.fenetre || '';
  $('demande').innerHTML = D.demande;
  const meta = (D.meta || '').trim();
  $('meta').innerHTML = meta;
  $('meta').style.display = meta ? 'block' : 'none';
  // une ligne = un paragraphe : c'est la granularité qu'on tape dans un formulaire
  $('rep').innerHTML = D.reponse.split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => `<p>${l}</p>`).join('');

  // La longueur du texte n'est pas connue à l'avance : on descend la taille jusqu'à ce
  // que le pavé tienne dans la fenêtre. Sans ça, le dernier paragraphe se fait couper —
  // et c'est celui-là qui porte la chute.
  const corps = $('corps'), win = corps.parentElement;
  const dispo = () => win.clientHeight - corps.offsetTop;
  for (var px = 22; px > 11; px -= 0.4) {
    corps.style.fontSize = px + 'px';
    corps.style.lineHeight = 1.54;
    $('demande').style.fontSize = (px * 1.15) + 'px';
    $('meta').style.fontSize = (px * 0.82) + 'px';
    if (corps.scrollHeight <= dispo()) break;
  }
  document.title = 'prêt';
</script>
</body>
</html>
