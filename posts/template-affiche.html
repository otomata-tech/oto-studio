<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap">
<style>
  /* __FONTS__ */
  :root {
    --bg: #fefcf5;
    --surface: #ffffff;
    --ink: #2c2112;
    --mute: #6c5e44;
    --hair: #dccfa8;
    --primary: #f0b41e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1500px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    background-image:
      linear-gradient(to right, rgba(44, 33, 18, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44, 33, 18, 0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    color: var(--ink);
    font-family: "Hanken Grotesk", sans-serif;
    display: flex; flex-direction: column;
    padding: 80px 88px 84px;
  }
  .grain {
    position: absolute; inset: 0; z-index: 40; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity: 0.07; mix-blend-mode: multiply;
  }
  .sun {
    position: absolute; z-index: 0; right: -140px; top: -160px;
    width: 900px; height: 900px;
    background: radial-gradient(closest-side, rgba(240,180,30,0.38), rgba(240,180,30,0.10) 55%, transparent 72%);
  }
  .fade { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: var(--bg); opacity: 0; }

  .mono { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.16em; }
  .display {
    font-family: "Bricolage Grotesque", sans-serif;
    font-optical-sizing: auto; font-variation-settings: "wdth" 90;
    font-weight: 600; letter-spacing: -0.02em;
  }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; color: var(--mute); z-index: 1; margin-bottom: 26px;
  }
  header .brand { color: var(--ink); font-weight: 700; font-size: 16px; }

  .context {
    font-family: "JetBrains Mono", monospace;
    font-size: 17px; color: var(--mute); letter-spacing: 0.02em;
    margin-bottom: 22px; z-index: 1;
  }
  .context b { color: var(--ink); font-weight: 700; }

  /* La scène occupe TOUTE la hauteur pendant l'animation, puis recule pour laisser
     monter la chute : pas de zone morte, et des contenus plus gros tant que ça bouge.
     `transform` n'affecte pas le layout — d'où la chute en absolute dans .stage. */
  .stage { position: relative; width: 1024px; height: 1180px; z-index: 1; }
  .scene { position: absolute; inset: 0; width: 1024px; height: 1180px; transform-origin: 50% 0%; }

  .card {
    position: absolute; left: 0; width: 1024px;
    background: var(--surface);
    border: 2px solid var(--ink);
    box-shadow: 7px 7px 0 rgba(44,33,18,0.85);
    display: flex; flex-direction: column;
    transform-origin: 50% 50%; overflow: hidden;
  }
  .card .bar {
    height: 52px; flex: none; background: var(--ink);
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
  }
  .card.lead .bar { background: var(--primary); }
  .card .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(254,252,245,0.45); flex: none; }
  .card.lead .dot { background: rgba(44,33,18,0.40); }
  .card .name {
    font-family: "JetBrains Mono", monospace; font-size: 19px; letter-spacing: 0.10em;
    color: var(--bg); margin-left: 6px; white-space: nowrap;
  }
  .card.lead .name { color: var(--ink); font-weight: 700; }
  .card .tag {
    margin-left: auto; font-family: "JetBrains Mono", monospace;
    font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(254,252,245,0.62);
  }
  .card.lead .tag { color: rgba(44,33,18,0.68); }
  .card .body { flex: 1; padding: 22px 24px; }
  .ln {
    font-family: "JetBrains Mono", monospace;
    font-size: 24px; line-height: 40px; white-space: pre;
    letter-spacing: -0.01em; color: var(--mute);
  }
  .ln.first { color: var(--ink); font-weight: 700; }

  .phrase { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; }
  .phrase p { font-size: 78px; line-height: 1.06; }
  .phrase .kick { display: inline-block; }

  footer {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1.5px solid var(--ink); padding-top: 22px;
    font-size: 14px; color: var(--mute); margin-top: auto; z-index: 1;
  }
  footer .url { color: var(--ink); font-weight: 700; font-size: 16px; }
</style>

<div class="sun" id="sun"></div>

<header>
  <div class="brand mono">oto.cx</div>
  <div class="mono" id="mention"></div>
</header>

<div class="context" id="ctx"></div>

<div class="stage">
  <div class="scene" id="scene"></div>
  <div class="phrase">
    <p class="display" id="ph"></p>
  </div>
</div>

<footer>
  <div class="mono">Otomata · alexis laporte</div>
  <div class="url mono">oto.cx</div>
</footer>

<div class="fade" id="fade"></div>
<div class="grain"></div>

<!--__DATA__-->
<script>
  const $ = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const io = (t0, d, t) => clamp((t - t0) / d);
  const eoc = p => 1 - Math.pow(1 - p, 3);
  const eob = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

  const A = window.__AFF;
  let CPS = 20;                // ms par caractère frappé — ajusté plus bas
  const ZOOM = 0.76;           // échelle finale : libère ~283 px pour la chute
  const ZOOM_DUR = 950;

  $('mention').textContent = A.mention || '';
  $('ctx').innerHTML = A.kicker || '';
  $('ph').innerHTML = (A.phrase || '') + (A.kick ? `<br><span class="kick" id="kick">${A.kick}</span>` : '');

  /* Mise en page calculée ici et pas en CSS : l'animation a besoin des positions en
     pixels, le nombre de cartes varie de 2 à 4, et chaque carte doit épouser SON
     contenu — une hauteur fixe laisserait du vide sous les cartes courtes. */
  const H = 1180, BAR = 52, PAD = 44;
  const cards = (A.cards || []).slice(0, 4);
  const rows = cards.map(c => (c.body || '').split('\n').filter(l => l.trim() !== '').slice(0, 8));

  // On part de la ligne à 40 px et on resserre seulement s'il le faut (plancher 26) :
  // une affiche lue au pouce sur un fil ne pardonne pas le texte rapetissé pour rien.
  let LH = 40;
  const stack = () => rows.reduce((s, r) => s + BAR + PAD + r.length * LH, 0);
  while (LH > 26 && stack() + 34 * (cards.length - 1) > H) LH -= 1;
  const FS = Math.round(LH * 0.6);

  /* Chaque carte épouse SON contenu, et c'est l'écart ENTRE les cartes qui absorbe le
     reste : la scène occupe la hauteur (le pattern l'exige — sinon le recul ouvre un
     trou) sans étirer les cartes autour de trois lignes de texte. Écart plafonné : au
     delà, l'affiche se disloque plus qu'elle ne respire. */
  const free = H - stack();
  const GAP = cards.length > 1
    ? Math.max(34, Math.min(130, Math.round(free / (cards.length - 1))))
    : 0;
  const used = stack() + GAP * (cards.length - 1);
  const OFFSET = Math.max(0, Math.round((H - used) / 2));
  const TILT = [-0.4, 0.5, -0.3, 0.45];

  /* La frappe donne la durée, et le texte est libre : sans borne, quatre cartes
     pleines feraient une vidéo de trente secondes que personne ne regarde. On tient
     la frappe dans une enveloppe en accélérant, jamais en coupant du texte.
     Pause entre lignes = 13 × CPS, donc tout se ramène à un seul facteur. */
  const PAUSE = 13;
  const strokes = rows.reduce((s, r) => s + r.reduce((n, t) => n + t.length + PAUSE, 0), 0);
  if (strokes > 0) CPS = Math.min(20, Math.max(6, Math.round(10500 / strokes)));

  const LINES = [];            // [{el, txt, t}] toutes cartes confondues
  let clock = 260;             // début de la première carte
  const CARD_IN = [];

  // ⚠️ pas `top` : dans un script global, il collisionne avec `window.top` et le
  // fichier entier ne s'exécute plus (« Identifier 'top' has already been declared »).
  let y = OFFSET;
  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card' + (i === 0 ? ' lead' : '');
    const h = BAR + PAD + rows[i].length * LH;
    el.style.top = y + 'px';
    el.style.height = h + 'px';
    y += h + GAP;
    el.innerHTML =
      `<div class="bar"><span class="dot"></span>` +
      `<span class="name"></span><span class="tag"></span></div>` +
      `<div class="body"></div>`;
    el.querySelector('.name').textContent = c.title || '';
    el.querySelector('.tag').textContent = c.tag || '';
    $('scene').appendChild(el);

    CARD_IN.push({ el, t: 200 + i * 250 });
    clock = Math.max(clock, 200 + i * 250 + 480);

    const body = el.querySelector('.body');
    rows[i].forEach((txt, j) => {
      const ln = document.createElement('div');
      ln.className = 'ln' + (j === 0 ? ' first' : '');
      ln.style.fontSize = FS + 'px';
      ln.style.lineHeight = LH + 'px';
      body.appendChild(ln);
      LINES.push({ el: ln, txt, t: clock });
      clock += (txt.length + PAUSE) * CPS;   // la ligne suivante attend la fin de celle-ci
    });
  });

  /* ⚠️ La chute ne doit JAMAIS monter pendant que la scène recule encore : il
     existerait une fenêtre où la scène est grande ET la chute visible, et une
     miniature tombée pile dessus donne l'impression d'une animation cassée.
     D'où `phrase = zoomOut + ZOOM_DUR + marge`, pas un simple décalage. */
  const T = {
    zoomOut: clock + 700,
    phrase: clock + 700 + ZOOM_DUR + 150,
    fadeOut: clock + 700 + ZOOM_DUR + 150 + 2900,
  };
  const LOOP = T.fadeOut + 700;
  window.__DURATION = LOOP;
  // Lisible dans le DOM : la durée dépend du texte, on veut pouvoir la vérifier sans
  // rendre la vidéo (`--dump-dom` suffit).
  document.body.dataset.dur = LOOP;
  // L'instant à capturer pour une image fixe : la composition est complète, le fondu
  // final n'a pas commencé. Sans ça, un PNG pris à la dernière image ne rend que le fond.
  window.__STILL = T.fadeOut - 200;

  function render(t) {
    t = t % LOOP;
    $('sun').style.transform = `scale(${1 + 0.025 * Math.sin(t / 1300)})`;
    $('ctx').style.opacity = eoc(io(0, 500, t));

    const dz = eoc(io(T.zoomOut, ZOOM_DUR, t));
    $('scene').style.transform = `scale(${1 - (1 - ZOOM) * dz})`;

    CARD_IN.forEach((c, i) => {
      const p = eob(io(c.t, 480, t));
      c.el.style.opacity = clamp(io(c.t, 200, t) * 3);
      c.el.style.transform = `rotate(${TILT[i] * (2 - p)}deg) scale(${1.06 - 0.06 * p})`;
    });

    // Frappe : le curseur ne vit que sur la dernière ligne commencée.
    let last = -1;
    for (let i = 0; i < LINES.length; i++) if (t >= LINES[i].t) last = i;
    LINES.forEach((L, i) => {
      if (t < L.t) { L.el.textContent = ''; return; }
      const n = Math.min(L.txt.length, Math.floor((t - L.t) / CPS));
      let s = L.txt.slice(0, n);
      if (i === last) {
        if (n < L.txt.length) s += '█';
        else if (Math.floor(t / 460) % 2 === 0) s += '█';
      }
      L.el.textContent = s;
    });

    const pp = eoc(io(T.phrase, 600, t));
    const ps = eoc(io(T.phrase + 400, 400, t));
    const ph = $('ph');
    ph.style.opacity = pp;
    ph.style.transform = `translateY(${34 * (1 - pp)}px)`;
    ph.style.textShadow = `${5 * ps}px ${5 * ps}px 0 #f0b41e`;

    const kick = $('kick');
    if (kick) {
      const pk = eoc(io(T.phrase + 900, 550, t));
      kick.style.opacity = pk;
      kick.style.transform = `translateY(${26 * (1 - pk)}px)`;
    }

    $('fade').style.opacity = io(T.fadeOut, 450, t);
  }

  window.__seek = render;
  render(0);

  const params = new URLSearchParams(location.search);
  if (params.get('capture') !== '1') {
    let s = null;
    function fr(now) { if (s === null) s = now; render(now - s); requestAnimationFrame(fr); }
    requestAnimationFrame(fr);
  }
</script>
